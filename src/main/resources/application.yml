spring:
  application:
    name: cms
  datasource:
    url: jdbc:postgresql://localhost:5432/cms_db
    username: postgres
    password: 123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 25MB

server:
  port: 8080

cms:
  file-store-path: ${FILE_STORE_PATH:./upload}
  file-upload:
    max-file-size: 5MB
    allowed-extensions: jpg,jpeg,png,gif,webp
    allowed-content-types: image/jpeg,image/png,image/gif,image/webp

# OpenAPI/Swagger UI: http://localhost:8080/swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
