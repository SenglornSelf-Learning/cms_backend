spring.application.name=cms
server.servlet.context-path=/admin

spring.datasource.url=jdbc:postgresql://localhost:5432/cms_db
spring.datasource.username=postgres
spring.datasource.password=123

mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.type-aliases-package=com.senglorn.cms.model

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:script/schema.sql

server.port=8080

# OpenAPI/Swagger UI is served under the servlet context path (see server.servlet.context-path).
# Example: http://localhost:8080/admin/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
